<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Connecting</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head><body><main class="container"><div class="card"><h1>Connecting Deriv…</h1><p id="msg" class="muted">Validating the OAuth response.</p></div></main><script>(async()=>{const m=document.getElementById('msg'),p=new URLSearchParams(location.search),code=p.get('code'),returnedState=p.get('state'),savedState=sessionStorage.getItem('gx_state'),verifier=sessionStorage.getItem('gx_verifier');if(p.get('error')){sessionStorage.removeItem('gx_auto_login_started');m.textContent='Deriv authorization was cancelled or failed: '+(p.get('error_description')||p.get('error'));return}if(!code||!returnedState||returnedState!==savedState||!verifier){sessionStorage.removeItem('gx_auto_login_started');m.textContent='Invalid or expired OAuth response. Please start again.';return}try{const r=await fetch(window.GOONFX_CONFIG.BACKEND_URL+'/api/oauth/exchange',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state:returnedState,code_verifier:verifier,redirect_uri:window.GOONFX_CONFIG.DERIV_REDIRECT_URI,client_id:window.GOONFX_CONFIG.DERIV_CLIENT_ID})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw new Error(d.error||'OAuth exchange failed');sessionStorage.setItem('gx_access_token',d.access_token);sessionStorage.removeItem('gx_state');sessionStorage.removeItem('gx_verifier');sessionStorage.removeItem('gx_auto_login_started');history.replaceState({},'',location.pathname);location.replace('/')}catch(e){sessionStorage.removeItem('gx_auto_login_started');m.textContent='Backend OAuth exchange failed: '+e.message;console.error(e)}})()</script></body></html>
