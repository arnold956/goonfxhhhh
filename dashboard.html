<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GoonFx — Options Terminal</title><style>:root{--nav:#071426;--blue:#12b8c7;--blue2:#0b6fd3;--line:#e4e8ed;--text:#263238;--muted:#8b949e;--green:#16c784;--red:#ff3b45}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--text);font:14px Arial,Helvetica,sans-serif}.top{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:24px;background:#fff}.brand{font-size:24px;font-weight:900;color:#40546f}.brand:before{content:'▌';color:#08182e;margin-right:7px}.brand small{display:block;font-size:9px;text-align:center;color:#173f69;margin-top:-3px}.reports{font-size:20px}.grow{flex:1}.currency{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:#fff;font-weight:700}.balance{font-size:20px;font-weight:900;color:#45b6ba}.avatar{font-size:28px}.bar{height:70px;background:var(--nav);display:flex;align-items:center;gap:4px;padding:0 16px;overflow:auto}.bar button{height:70px;border:0;background:transparent;color:#fff;padding:0 18px;font-size:16px;font-weight:900;white-space:nowrap}.bar button.active{background:#28b7c2}.bar button:hover{background:#12304f}.wrap{height:calc(100vh - 132px);min-height:680px;display:grid;grid-template-columns:1fr 375px;overflow:hidden}.left{position:relative;min-width:0;border-right:1px solid var(--line)}.marketbox{position:absolute;top:24px;left:34px;z-index:5;background:#fff;border-radius:8px;box-shadow:0 4px 18px #00000012;border:1px solid #eef0f2;width:400px;padding:14px 18px}.marketbox select{border:0;font-size:20px;font-weight:900;width:100%;outline:0;color:#333}.marketbox small{color:#999;font-size:17px}.chart{height:58%;min-height:390px;border-bottom:1px solid #222;background:repeating-linear-gradient(0deg,#fff 0,#fff 79px,#e8ecef 80px),repeating-linear-gradient(90deg,transparent 0,transparent 98px,#e8ecef 99px);position:relative}.chart canvas{width:100%;height:100%}.price{position:absolute;right:12px;top:52%;background:#111;color:#fff;padding:7px 12px;border-radius:4px;font-weight:900}.tools{position:absolute;left:16px;top:215px;width:62px;background:#fff;border:1px solid #e2e5e8;box-shadow:0 2px 10px #0002;border-radius:6px;z-index:4}.tools div{height:58px;display:grid;place-items:center;font-size:24px;border-bottom:1px solid #eee}.digits-area{height:42%;padding:14px 28px;background:#fff}.digitline{height:80%;display:flex;align-items:center;justify-content:center;gap:12px}.digit{width:66px;height:66px;border-radius:50%;background:#fff;border:7px solid #e8ecef;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:20px;font-weight:900}.digit small{font-size:11px;color:#777;font-weight:500}.digit.live{border-color:#54bfc4}.digit.sel{border-color:#ef4444}.digit .arrow{font-size:11px;color:#f33;margin-top:1px}.legend{display:flex;justify-content:center;gap:25px;color:#777;font-size:12px}.right{background:#f8f9fa;padding:22px 14px;overflow:auto}.learn{font-size:12px;text-decoration:underline;color:#4b657a;margin:0 12px 10px}.typecard{background:#fff;border:1px solid #a9c6d0;border-radius:7px;padding:17px;font-size:20px;font-weight:900;margin-bottom:10px}.typecard span{float:right}.duration{background:#fff;border-radius:8px;padding:18px;margin-bottom:10px}.duration h3{margin:0 0 18px;text-align:center;font-weight:500}.ticks{height:7px;background:#e2e6e8;border-radius:9px;position:relative}.ticks i{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;border:1px solid #e0e4e6;top:-4px}.ticks i:nth-child(1){left:0}.ticks i:nth-child(2){left:12%}.ticks i:nth-child(3){left:24%}.ticks i:nth-child(4){left:36%}.ticks i:nth-child(5){left:48%}.ticks i:nth-child(6){left:60%}.ticks i:nth-child(7){left:72%}.ticks i:nth-child(8){left:84%}.ticks i:nth-child(9){right:0}.dur{text-align:center;font-size:20px;font-weight:900;margin-top:22px}.stake{background:#fff;border-radius:8px;padding:0;margin-bottom:10px}.switch{display:flex}.switch button{flex:1;border:0;padding:14px;font-size:17px;background:#fff}.switch .on{background:#dfe3e5;font-weight:900}.amount{display:flex;align-items:center;justify-content:space-between;padding:14px;font-size:19px}.amount button{border:0;background:#f3f4f5;border-radius:5px;font-size:22px;width:34px;height:34px}.payout{padding:8px 12px;font-size:18px}.tradebtn{width:100%;border:0;padding:18px;background:#4cb4b8;color:#fff;font-size:18px;font-weight:900;cursor:pointer}.tradebtn:disabled{opacity:.45}.err{background:#fff0f1;color:#c22;padding:10px;border-radius:6px;margin-top:8px;font-size:12px}.ok{background:#edfff7;color:#078a58;padding:10px;border-radius:6px;margin-top:8px;font-size:12px}.history{background:#fff;margin-top:10px;border-radius:8px;padding:12px}.history h3{margin:0 0 8px}.row{display:flex;justify-content:space-between;border-top:1px solid #eee;padding:9px 0;font-size:12px}@media(max-width:1100px){.wrap{grid-template-columns:1fr}.right{position:absolute;right:0;top:132px;width:375px;height:calc(100vh - 132px);z-index:10}.left{border:0}.marketbox{width:340px}}@media(max-width:700px){.bar button{padding:0 10px;font-size:13px}.marketbox{left:10px;width:calc(100% - 20px)}.right{width:100%}.digitline{gap:3px;overflow:hidden}.digit{width:48px;height:48px;border-width:5px;font-size:16px}.digit small{font-size:8px}}</style></head><body><header class="top"><div class="brand">tradescheme<small>deriv</small></div><div class="reports">▤ Reports</div><span class="grow"></span><div class="currency">USD ▾</div><div class="avatar">🇺🇸</div><div class="balance" id="balance">0.00 USD</div><div>⌄</div></header><nav class="bar"><button data-tool="bot">🤖 Free Bots</button><button data-tool="premium">🤖 Premium AI Bots</button><button data-tool="quick">🤖 Quick Bot</button><button data-tool="signal">◎ Signal AI</button><button class="active" data-tool="manual">▣ Manual Trader</button><button data-tool="bulk">▱ Bulk Trader</button><button data-tool="apex">♨ Apex Bot</button><button data-tool="copy">▣ Copy Trader</button><button data-tool="analysis">⌕ Analysis Tools</button></nav><main class="wrap"><section class="left"><div class="marketbox"><select id="market"><option>Loading markets…</option></select><small id="marketSub">Live Deriv market</small></div><div class="tools"><div>⌁</div><div>⌁</div><div>▤</div><div>✎</div><div>⇩</div></div><div class="chart"><canvas id="canvas"></canvas><div class="price" id="price">—</div></div><div class="digits-area"><div class="digitline" id="digits"></div><div class="legend">● LIVE TICKS &nbsp;&nbsp; Last digit <b id="lastDigit">—</b> &nbsp;&nbsp; Ticks <b id="tickCount">0</b></div></div></section><aside class="right"><div class="learn">Learn about this trade type</div><div class="typecard">▦ ▴ <span id="typeName">Even/Odd</span></div><div class="duration"><h3>Ticks</h3><div class="ticks"> <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="dur"><button style="border:0;background:#fff;font-size:24px" id="durMinus">−</button> <span id="duration">1</span> Tick <button style="border:0;background:#fff;font-size:24px" id="durPlus">+</button></div></div><div class="stake"><div class="switch"><button class="on">Stake</button><button>Payout</button></div><div class="amount"><button id="minus">−</button><b id="stake">1</b><span>USD</span><button id="plus">+</button></div><div class="payout">Payout <b id="payout">—</b> USD</div><button class="tradebtn" id="execute" disabled>GET PROPOSAL</button></div><div id="message" class="history">Connect to Deriv, select a contract and request a proposal before buying.</div><div class="history"><h3>Recent trades</h3><div id="historyRows"><div class="row"><span>No trades yet</span><span>—</span></div></div></div></aside></main><script>const TYPES=[['DIGITEVEN','Even'],['DIGITODD','Odd'],['DIGITOVER','Over'],['DIGITUNDER','Under'],['DIGITMATCH','Matches'],['DIGITDIFF','Differs'],['CALL','Rise'],['PUT','Fall'],['HIGHER','Higher'],['LOWER','Lower'],['ONETOUCH','Touch'],['NOTOUCH','No Touch']];let state={symbol:'',type:'DIGITEVEN',digit:5,stake:1,duration:1,prices:[],ws:null,proposal:null};const $=s=>document.querySelector(s);function msg(t,good=false){$('#message').className=good?'ok':'history';$('#message').textContent=t}function renderDigits(){const d=$('#digits');d.innerHTML='';const counts=Array(10).fill(10);const total=counts.reduce((a,b)=>a+b,0);counts.forEach((n,i)=>{const e=document.createElement('button');e.className='digit '+(i===state.digit?'sel':'');e.innerHTML=`${i}<small>${(n/total*100).toFixed(1)}%</small>${i===state.digit?'<span class="arrow">▲</span>':''}`;e.onclick=()=>{state.digit=i;renderDigits()};d.appendChild(e)})}function setupMarketSelect(ms){const s=$('#market');s.innerHTML=ms.map(m=>`<option value="${m.symbol||m.underlying_symbol}">${m.display||m.underlying_symbol_name||m.symbol||m.underlying_symbol}</option>`).join('');if(ms[0]){state.symbol=ms[0].symbol||ms[0].underlying_symbol;s.value=state.symbol;selectMarket()}}async function api(path,opt={}){const r=await fetch(path,{credentials:'include',headers:{'Content-Type':'application/json'},...opt});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw new Error(d.error||d.message||`HTTP ${r.status}`);return d}async function load(){try{const d=await api('/api/markets');setupMarketSelect(d.markets||[]);const a=await api('/api/account');$('#balance').textContent=`${Number(a.balance||0).toFixed(2)} ${a.currency||'USD'}`;msg('Deriv account connected. Select a contract and request a proposal.',true)}catch(e){msg('Deriv connection: '+e.message)}}async function selectMarket(){state.symbol=$('#market').value;const opt=$('#market').selectedOptions[0];$('#marketSub').textContent=opt?opt.textContent:'Live Deriv market';state.prices=[];try{state.ws&&state.ws.close()}catch{};const w=new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');state.ws=w;w.onopen=()=>{w.send(JSON.stringify({ticks_history:state.symbol,count:150,end:'latest',style:'ticks'}));w.send(JSON.stringify({ticks:state.symbol,subscribe:1}))};w.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.history){state.prices=(d.history.prices||[]).map(Number);draw()}if(d.tick){state.prices.push(Number(d.tick.quote));if(state.prices.length>180)state.prices.shift();$('#price').textContent=d.tick.quote;const z=String(d.tick.quote).replace(/\D/g,'').slice(-1);$('#lastDigit').textContent=z;$('#tickCount').textContent=state.prices.length;draw()}};w.onerror=()=>msg('Live market feed failed. Please try another market.')};function draw(){const c=$('#canvas'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);if(state.prices.length<2)return;const mn=Math.min(...state.prices),mx=Math.max(...state.prices),rg=mx-mn||1;x.beginPath();state.prices.forEach((p,i)=>{const xx=5+i*(r.width-10)/(state.prices.length-1),yy=r.height-10-(p-mn)/rg*(r.height-20);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.strokeStyle='#202020';x.lineWidth=2;x.stroke()}function contractButtons(){const bar=document.createElement('div');bar.style.cssText='position:absolute;top:14px;right:15px;z-index:7;background:#fff;border:1px solid #ddd;border-radius:8px;padding:7px;box-shadow:0 3px 12px #0002;display:flex;gap:5px;flex-wrap:wrap;max-width:510px';bar.id='contracts';TYPES.forEach(([v,n])=>{const b=document.createElement('button');b.textContent=n;b.dataset.t=v;b.style.cssText='border:1px solid #ccd5db;background:#fff;border-radius:6px;padding:7px 9px;font-weight:800;cursor:pointer';b.onclick=()=>{state.type=v;state.proposal=null;$('#typeName').textContent=n;$('#execute').textContent='GET PROPOSAL';$('#execute').disabled=false;bar.querySelectorAll('button').forEach(x=>x.style.background=x===b?'#2db7bf':'#fff');msg('Ready to request a '+n+' proposal.')};bar.appendChild(b)});$('.chart').appendChild(bar)}async function proposal(){if(!state.symbol)return msg('Select a market first.');const body={underlying_symbol:state.symbol,contract_type:state.type,amount:state.stake,stake:state.stake,duration:state.duration,duration_unit:'t'};if(['DIGITMATCH','DIGITDIFF','DIGITOVER','DIGITUNDER'].includes(state.type))body.digit=String(state.digit);if(['HIGHER','LOWER','ONETOUCH','NOTOUCH'].includes(state.type))body.barrier=$('#lastDigit').textContent||String(state.digit);try{$('#execute').disabled=true;msg('Requesting live Deriv proposal…');const d=await api('/api/proposal',{method:'POST',body:JSON.stringify(body)});state.proposal=d.proposal;const ask=Number(d.proposal.ask_price||state.stake),pay=Number(d.proposal.payout||0);$('#payout').textContent=pay.toFixed(2);$('#execute').textContent=`BUY ${ask.toFixed(2)} USD`;$('#execute').disabled=false;msg(`Proposal ready. Review payout ${pay.toFixed(2)} USD, then press BUY.`,true)}catch(e){state.proposal=null;$('#execute').disabled=false;msg('Proposal failed: '+e.message)}}async function buy(){if(!state.proposal)return proposal();const p=state.proposal;try{$('#execute').disabled=true;msg('Sending authenticated BUY to Deriv…');const d=await api('/api/buy',{method:'POST',body:JSON.stringify({proposal_id:p.id||p.proposal_id,price:Number(p.ask_price||state.stake)})});if(!d.executed)throw new Error('Deriv did not confirm the contract purchase.');const id=d.contract_id;$('#execute').textContent='TRADE EXECUTED ✓';msg(`Trade executed successfully. Contract ID: ${id}`,true);$('#historyRows').insertAdjacentHTML('afterbegin',`<div class="row"><span>${$('#typeName').textContent} · ${state.symbol}</span><b>#${id}</b></div>`);state.proposal=null;setTimeout(()=>{if($('#execute')){$('#execute').textContent='GET PROPOSAL';$('#execute').disabled=false}},2500)}catch(e){$('#execute').disabled=false;msg('BUY failed: '+e.message)}}$('#market').onchange=selectMarket;$('#execute').onclick=buy;$('#minus').onclick=()=>{state.stake=Math.max(.35,Number((state.stake-.5).toFixed(2)));$('#stake').textContent=state.stake;state.proposal=null;$('#execute').textContent='GET PROPOSAL'};$('#plus').onclick=()=>{state.stake=Number((state.stake+.5).toFixed(2));$('#stake').textContent=state.stake;state.proposal=null;$('#execute').textContent='GET PROPOSAL'};$('#durMinus').onclick=()=>{state.duration=Math.max(1,state.duration-1);$('#duration').textContent=state.duration;state.proposal=null;$('#execute').textContent='GET PROPOSAL'};$('#durPlus').onclick=()=>{state.duration++;$('#duration').textContent=state.duration;state.proposal=null;$('#execute').textContent='GET PROPOSAL'};document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.bar button').forEach(x=>x.classList.remove('active'));b.classList.add('active');msg(b.dataset.tool==='manual'?'Manual Trader ready.':b.textContent+' workspace selected.')});renderDigits();contractButtons();load();</script></body></html>
