<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX Analysis</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head><body><div class="app"><nav class="nav"><a class="brand" href="index.html">GOON FX</a><div class="navlinks"><a href="manual-trader.html">Trader</a><a href="bots.html">Bots</a><a class="active" href="analysis.html">Analysis</a><a href="risk.html">Risk</a></div></nav><main class="container"><div class="topline"><h1>Analysis Center</h1><span class="muted">Live Deriv statistics</span></div><div class="grid"><section class="card"><h3>Digit Distribution</h3><div id="chart" class="grid"></div><p id="status" class="muted">Load live data.</p></section><section class="card"><h3>Session Metrics</h3><div class="stats"><div class="stat">Sample<b id="sample">—</b></div><div class="stat">Even<b id="even">—</b></div><div class="stat">Odd<b id="odd">—</b></div><div class="stat">Hot digits<b id="hot">—</b></div></div><button class="btn greenbtn" style="margin-top:12px" onclick="run()">REFRESH ANALYSIS</button></section></div><div class="notice" style="margin-top:12px">Statistics describe historical ticks. They are not guarantees of the next result.</div></main></div><script>const C=window.GOONFX_CONFIG||{};async function run(){status.textContent='Loading live Deriv data…';try{const r=await fetch((C.BACKEND_URL||'https://api.goonfx.com')+'/api/analysis/ticks',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:'R_100',count:250})});const d=await r.json();if(!r.ok)throw Error(d.error||'Analysis unavailable');sample.textContent=d.sample_size;even.textContent=d.even_pct.toFixed(1)+'%';odd.textContent=d.odd_pct.toFixed(1)+'%';hot.textContent=d.hot_digits.join(', ');chart.innerHTML=d.counts.map((n,i)=>`<div class="card"><b>${i}</b><div style="height:${Math.max(8,n/d.sample_size*180)}px;background:#ff3040;border-radius:5px"></div><small>${n}</small></div>`).join('');status.textContent='LIVE DERIV ANALYSIS READY'}catch(e){status.textContent=e.message}}run()</script></body></html>
