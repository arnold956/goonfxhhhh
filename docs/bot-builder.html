<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX Bot Builder</title><link rel="stylesheet" href="styles.css"></head><body><div class="app"><nav class="nav"><a class="brand" href="index.html">GOON FX</a><div class="navlinks"><a href="bots.html">Free Bots</a><a class="active" href="bot-builder.html">Bot Builder</a><a href="analysis.html">Analysis</a><a href="risk.html">Risk</a></div></nav><main class="container"><div class="topline"><h1>Bot Builder</h1><span class="muted">Build → validate → run</span></div><div class="workspace"><section class="panel" style="padding:16px"><h3>Strategy blocks</h3><div class="grid"><button class="btn dark" onclick="add('MARKET')">Market</button><button class="btn dark" onclick="add('EMA CROSS')">EMA Cross</button><button class="btn dark" onclick="add('RSI FILTER')">RSI Filter</button><button class="btn dark" onclick="add('BOLLINGER')">Bollinger</button><button class="btn dark" onclick="add('MOMENTUM')">Momentum</button><button class="btn dark" onclick="add('RISK GATE')">Risk Gate</button><button class="btn dark" onclick="add('ENTRY')">Entry</button><button class="btn dark" onclick="add('EXIT')">Exit</button></div></section><aside class="card"><h3>Strategy Canvas</h3><div id="canvas" class="notice">Add blocks to build your strategy.</div><div class="trade-grid" style="margin-top:10px"><button class="btn dark" onclick="clearCanvas()">CLEAR</button><button class="btn greenbtn" onclick="validate()">VALIDATE</button></div><p id="status" class="muted"></p></aside></div></main></div><script>const c=document.getElementById('canvas'),s=document.getElementById('status');function add(x){const d=document.createElement('div');d.className='card';d.style.margin='8px 0';d.textContent=x;c.appendChild(d)}function clearCanvas(){c.innerHTML=''}function validate(){const n=c.children.length;s.textContent=n<3?'Add at least Market, Entry and Risk Gate blocks.':'Strategy validated for demo testing. Live execution requires an authenticated Deriv account.'}</script></body></html>
