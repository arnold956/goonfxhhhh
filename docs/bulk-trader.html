<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Bulk Trader</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="tools.html">Tools</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Bulk Trader</h1><div class="grid"><div class="card form"><label>Bulk request JSON<textarea id="payload" class="input" rows="12">{
  "orders": []
}</textarea></label><button class="btn" id="preview">Validate & Preview</button></div><div class="card"><h3>Preview</h3><pre id="result" class="muted">No orders loaded.</pre></div></div><div class="notice" style="margin-top:20px">Bulk trading can place multiple contracts. This interface only validates and previews requests until the authenticated backend and account permissions are confirmed. It will not place trades automatically.</div></main></div><script>document.getElementById('preview').onclick=()=>{const r=document.getElementById('result');try{const x=JSON.parse(document.getElementById('payload').value);if(!Array.isArray(x.orders))throw new Error('orders must be an array');r.textContent=JSON.stringify({valid:true,count:x.orders.length,orders:x.orders},null,2)}catch(e){r.textContent='Invalid request: '+e.message}}</script></body></html>
