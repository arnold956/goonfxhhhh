<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Bulk Trader</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="trade.html">Trade</a><a class="active" href="bulk-trader.html">Bulk Trader</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Bulk Trader</h1><p class="muted">Prepare multiple live Deriv proposals, review them, then explicitly confirm purchases.</p><div class="grid"><div class="card form"><label>Orders JSON<textarea id="payload" class="input" rows="15">[{"symbol":"R_100","contract_type":"DIGITOVER","barrier":"5","stake":1,"duration":1,"duration_unit":"t"},{"symbol":"R_100","contract_type":"DIGITEVEN","stake":1,"duration":1,"duration_unit":"t"}]</textarea></label><div class="actions"><button class="btn" id="proposals">Get Live Proposals</button><button class="btn secondary" id="buy" disabled>Buy All</button></div><div id="account" class="muted" style="margin-top:10px">Checking Deriv session…</div></div><div class="card"><h3>Results</h3><pre id="result" class="muted">Connect Deriv first.</pre></div></div></main></div><script>let prepared=[],accountId=null;const out=document.getElementById('result'),buy=document.getElementById('buy'),account=document.getElementById('account');async function getAccount(){try{const d=await goonfxApi('/api/account');const a=d.accounts?.[0];if(!a?.account_id)throw Error('No Deriv account returned');accountId=a.account_id;account.textContent=`Connected: ${a.account_id} · ${a.currency||'USD'} · ${a.balance??'—'}`;return a}catch(e){accountId=null;account.textContent='Not connected to Deriv: '+e.message;return null}}document.getElementById('proposals').onclick=async()=>{buy.disabled=true;prepared=[];try{const a=await getAccount();if(!a)throw Error('Sign in with Deriv before requesting proposals');const orders=JSON.parse(document.getElementById('payload').value);if(!Array.isArray(orders)||!orders.length||orders.length>100)throw Error('Provide 1 to 100 orders');out.textContent='Requesting live proposals…';for(const o of orders){const d=await derivProposal({amount:Number(o.stake||o.amount||1),basis:o.basis||'stake',contract_type:o.contract_type,currency:o.currency||a.currency||'USD',duration:Number(o.duration||1),duration_unit:o.duration_unit||'t',underlying_symbol:o.symbol||'R_100',account_id:o.account_id||accountId,...(o.barrier!==undefined?{barrier:String(o.barrier)}:{}),...(o.barrier2!==undefined?{barrier2:String(o.barrier2)}:{}),...(o.multiplier!==undefined?{multiplier:Number(o.multiplier)}:{})});if(d.proposal?.id)prepared.push({proposal_id:d.proposal.id,price:Number(d.proposal.ask_price),order:o});else prepared.push({ok:false,error:d.error||'No proposal returned',order:o})}out.textContent=JSON.stringify(prepared,null,2);buy.disabled=!prepared.some(x=>x.proposal_id&&Number.isFinite(x.price))}catch(e){out.textContent=e.message}};buy.onclick=async()=>{const valid=prepared.filter(x=>x.proposal_id&&Number.isFinite(x.price));if(!valid.length)return;if(!confirm(`Buy ${valid.length} contracts on account ${accountId}?`))return;out.textContent='Buying…';const results=[];for(const o of valid){try{results.push({ok:true,order:o,result:await derivBuy(o.proposal_id,o.price,accountId)})}catch(e){results.push({ok:false,order:o,error:e.message})}}out.textContent=JSON.stringify(results,null,2);buy.disabled=true};getAccount();</script></body></html>
