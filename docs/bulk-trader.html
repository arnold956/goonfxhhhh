<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Bulk Trader</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="trade.html">Trade</a><a href="bulk-trader.html">Bulk Trader</a><a href="over-under.html">Over & Under</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Bulk Trader</h1><p class="muted">Prepare multiple trades, then explicitly execute them. Pricing is handled internally by the server.</p><div class="grid"><div class="card form"><label>Orders JSON<textarea id="payload" class="input" rows="15">[{"symbol":"R_100","contract_type":"DIGITOVER","barrier":"5","stake":1,"duration":1,"duration_unit":"t"},{"symbol":"R_100","contract_type":"DIGITEVEN","stake":1,"duration":1,"duration_unit":"t"}]</textarea></label><button class="btn" id="execute">EXECUTE ALL TRADES</button><div id="account" class="muted" style="margin-top:10px">Checking Deriv session…</div></div><div class="card"><h3>Results</h3><pre id="result" class="muted">Connect Deriv first.</pre></div></div></main></div><script>const API=(window.GOONFX_CONFIG?.BACKEND_URL||'https://api.goonfx.com').replace(/\/$/,''),$=id=>document.getElementById(id);async function api(path,opt={}){const r=await fetch(API+path,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{d={error:t}}if(!r.ok)throw Error(d.error||d.message||('HTTP '+r.status));return d}async function account(){try{const d=await api('/api/account');const a=d.accounts?.[0];if(!a)throw Error('No Deriv account returned');$('account').textContent=`Connected: ${a.account_id} · ${a.currency||''} · ${a.balance??'—'}`;return a}catch(e){$('account').textContent='Not connected: '+e.message;return null}}$('execute').onclick=async()=>{try{const a=await account();if(!a)throw Error('Connect Deriv first');const orders=JSON.parse($('payload').value);if(!Array.isArray(orders)||!orders.length||orders.length>100)throw Error('Provide 1 to 100 orders');const real=String(a.account_type||a.type||'').toLowerCase().includes('real');if(real&&!confirm(`REAL ACCOUNT: execute ${orders.length} trades using your Deriv balance?`))return;$('execute').disabled=true;$('result').textContent='Executing trades…';const results=[];for(const o of orders){try{const body={...o,account_id:o.account_id||a.account_id,currency:o.currency||a.currency||'USD',stake:Number(o.stake||o.amount||1),duration:Number(o.duration||1),duration_unit:o.duration_unit||'t'};const r=await api('/api/trade',{method:'POST',body:JSON.stringify(body)});results.push({ok:true,contract_id:r.buy?.contract_id,order:o})}catch(e){results.push({ok:false,error:e.message,order:o})}}$('result').textContent=JSON.stringify(results,null,2)}catch(e){$('result').textContent=e.message}finally{$('execute').disabled=false}};account();</script></body></html>
