<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Bulk Trader</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="tools.html">Tools</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Bulk Trader</h1><p class="muted">Prepare multiple contracts for the currently authenticated Deriv account. Proposals are requested first; purchases require a separate confirmation.</p><div class="grid"><div class="card form"><label>Orders JSON<textarea id="payload" class="input" rows="15">[{"symbol":"R_100","contract_type":"DIGITOVER","barrier":"5","stake":1},{"symbol":"R_100","contract_type":"DIGITEVEN","stake":1}]</textarea></label><div class="actions"><button class="btn" id="proposals">Get Proposals</button><button class="btn secondary" id="buy" disabled>Buy All</button></div></div><div class="card"><h3>Results</h3><pre id="result" class="muted">Connect Deriv first.</pre></div></div></main></div><script>let prepared=[];document.getElementById('proposals').onclick=async()=>{const r=document.getElementById('result'),buy=document.getElementById('buy');buy.disabled=true;prepared=[];try{const orders=JSON.parse(document.getElementById('payload').value);if(!Array.isArray(orders)||!orders.length||orders.length>100)throw new Error('Provide 1 to 100 orders');r.textContent='Requesting proposals…';for(const o of orders){const d=await derivProposal({amount:Number(o.stake||1),basis:'stake',contract_type:o.contract_type,currency:o.currency||'USD',duration:Number(o.duration||1),duration_unit:o.duration_unit||'t',underlying_symbol:o.symbol||'R_100',...(o.barrier!==undefined?{barrier:String(o.barrier)}:{})});if(d.proposal?.id)prepared.push({proposal_id:d.proposal.id,price:Number(d.proposal.ask_price),order:o});else prepared.push({ok:false,error:'No proposal returned',order:o})}r.textContent=JSON.stringify(prepared,null,2);buy.disabled=!prepared.some(x=>x.proposal_id&&Number.isFinite(x.price))}catch(e){r.textContent=e.message}};document.getElementById('buy').onclick=async()=>{const valid=prepared.filter(x=>x.proposal_id&&Number.isFinite(x.price));if(!valid.length)return;if(!confirm(`Buy ${valid.length} contracts on the authenticated account?`))return;const r=document.getElementById('result');r.textContent='Buying…';const results=[];for(const o of valid){try{results.push({ok:true,order:o,result:await derivBuy(o.proposal_id,o.price)})}catch(e){results.push({ok:false,order:o,error:e.message})}}r.textContent=JSON.stringify(results,null,2);document.getElementById('buy').disabled=true};</script></body></html>
