<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Connecting</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head><body><main class="container"><div class="card"><h1>Connecting Deriv…</h1><p id="msg" class="muted">Validating the OAuth response.</p></div></main><script>(async()=>{const m=document.getElementById('msg'),p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state'),expected=sessionStorage.getItem('deriv_state'),verifier=sessionStorage.getItem('deriv_verifier');if(p.get('error')){m.textContent='Deriv authorization failed: '+p.get('error');return}if(!code||!state||state!==expected||!verifier){m.textContent='Invalid or expired OAuth response. Please start again.';return}try{const r=await fetch((window.GOONFX_CONFIG.BACKEND_URL||'')+'/api/oauth/exchange',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,state,code_verifier:verifier,redirect_uri:window.GOONFX_CONFIG.DERIV_REDIRECT_URI,client_id:window.GOONFX_CONFIG.DERIV_CLIENT_ID})});if(!r.ok)throw new Error(await r.text());sessionStorage.removeItem('deriv_state');sessionStorage.removeItem('deriv_verifier');location.href='dashboard.html'}catch(e){m.textContent='Backend OAuth exchange failed. Check Render, DNS, CORS and Deriv settings.';console.error(e)}})()</script></body></html>
