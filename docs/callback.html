<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Connecting</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script></head><body><main class="container"><div class="card"><h1>Connecting Deriv…</h1><p id="msg" class="muted">Completing secure authentication.</p></div></main><script>(async()=>{const m=document.getElementById('msg'),p=new URLSearchParams(location.search),code=p.get('code'),state=p.get('state'),expected=sessionStorage.getItem('deriv_state'),verifier=sessionStorage.getItem('deriv_verifier');if(p.get('error')){m.textContent='Deriv authorization failed: '+(p.get('error_description')||p.get('error'));return}if(!code||!state||state!==expected||!verifier){m.textContent='Invalid or expired OAuth response. Please start again.';return}try{const cfg=window.GOONFX_CONFIG||{},r=await fetch((cfg.BACKEND_URL||'')+'/api/oauth/exchange',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,code_verifier:verifier,redirect_uri:cfg.DERIV_REDIRECT_URI,client_id:cfg.DERIV_CLIENT_ID})});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{}if(!r.ok)throw new Error(d.error||d.message||`OAuth exchange HTTP ${r.status}`);sessionStorage.removeItem('deriv_state');sessionStorage.removeItem('deriv_verifier');m.textContent='Deriv connected. Opening your dashboard…';location.replace('dashboard.html')}catch(e){m.textContent='Deriv connection failed: '+e.message;console.error(e)}})()</script></body></html>
