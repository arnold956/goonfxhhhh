<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Digits</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="live-deriv-feed.js"></script><script src="app.js" defer></script><style>.digits-page{padding:24px}.digit-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;margin-top:18px}.digit-card{background:#0d1115;border:1px solid #293139;border-radius:12px;padding:12px;text-align:center}.digit-circle{width:58px;height:58px;margin:8px auto;border:2px solid #293139;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900}.digit-pct{font-weight:800}.digit-label{font-size:11px;color:#89939a}.live-chart{width:100%;height:390px;background:#080b0e;border-radius:12px;margin-top:18px}.live-head{display:flex;justify-content:space-between;gap:12px;align-items:center}.live-status{color:#16d39a;font-weight:800}@media(max-width:800px){.digit-grid{grid-template-columns:repeat(5,1fr)}}@media(max-width:450px){.digit-grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="app"><nav class="nav"><a class="brand" href="index.html">GOON<span>FX</span></a><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="manual-trader.html">Trader</a><a href="over-under.html">Over/Under</a><a href="even-odd.html">Even/Odd</a><a class="active" href="digits.html">Digits</a><a href="bulk-trader.html">Bulk</a><a href="bots.html">Bots</a><a href="analysis.html">Analysis</a></div></nav><main class="digits-page"><div class="live-head"><div><span class="eyebrow">LIVE DIGIT ANALYSIS</span><h1>Digits</h1><p>Live last-digit distribution from Deriv.</p></div><div><select id="digit-symbol" class="input"><option value="1HZ100V">Volatility 100 (1s)</option><option value="1HZ75V">Volatility 75 (1s)</option><option value="1HZ50V">Volatility 50 (1s)</option><option value="1HZ25V">Volatility 25 (1s)</option><option value="1HZ10V">Volatility 10 (1s)</option></select><div class="live-status" id="digit-status">CONNECTING…</div></div></div><canvas id="digit-chart" class="live-chart"></canvas><div class="digit-grid" id="digit-grid"></div></main></div><script>(function(){let ticks=[];const grid=document.getElementById('digit-grid'),status=document.getElementById('digit-status'),canvas=document.getElementById('digit-chart'),ctx=canvas.getContext('2d'),select=document.getElementById('digit-symbol');function digit(v){const m=String(v).match(/(\d)$/);return m?+m[1]:null}function render(){const c=Array(10).fill(0);ticks.forEach(v=>{const d=digit(v);if(d!==null)c[d]++});const total=Math.max(1,ticks.length);grid.innerHTML=c.map((n,i)=>`<div class="digit-card"><div class="digit-label">DIGIT</div><div class="digit-circle">${i}</div><div class="digit-pct">${(n/total*100).toFixed(1)}%</div><div class="digit-label">${n} ticks</div></div>`).join('')}function draw(){const r=canvas.getBoundingClientRect(),d=devicePixelRatio||1;canvas.width=r.width*d;canvas.height=r.height*d;ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,r.width,r.height);if(ticks.length<2)return;const v=ticks.slice(-150),mn=Math.min(...v),mx=Math.max(...v),range=mx-mn||1;ctx.beginPath();v.forEach((p,i)=>{const x=8+i*(r.width-16)/(v.length-1),y=r.height-10-(p-mn)/range*(r.height-20);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.strokeStyle='#16d39a';ctx.lineWidth=2;ctx.stroke()}function start(){ticks=[];render();status.textContent='CONNECTING…';if(!window.GOONFXLiveDeriv)return;window.GOONFXLiveDeriv.subscribe(select.value);window.GOONFXLiveDeriv.on(s=>{if(s.symbol!==select.value)return;ticks=s.ticks||[];status.textContent=s.connected?'● LIVE · DERIV':'RECONNECTING…';render();draw()})}select.onchange=start;window.addEventListener('resize',draw);start()})();</script></body></html>
