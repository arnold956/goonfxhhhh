<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Even / Odd</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script><script src="market-loader.js"></script></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="digits.html">Digits</a><a href="over-under.html">Over/Under</a><a href="even-odd.html">Even/Odd</a><a href="accumulators.html">Accumulators</a><a href="portfolio.html">Portfolio</a></div></nav><main class="container"><h1>Even / Odd</h1><p class="muted">All currently active Deriv markets that support Even/Odd are loaded automatically.</p><div class="grid"><div class="card form"><label>Market<select class="input" id="symbol"><option>Loading markets…</option></select></label><label>Stake<input id="stake" class="input" type="number" min="0.35" step="0.01" value="1"></label><label>Duration<select id="duration" class="input"><option value="1">1 Tick</option><option value="2">2 Ticks</option><option value="5">5 Ticks</option><option value="10">10 Ticks</option></select></label><div class="actions"><button class="btn" data-contract="DIGITEVEN">EVEN</button><button class="btn secondary" data-contract="DIGITODD">ODD</button></div></div><div class="card"><h3>Live Proposal</h3><pre id="result" class="muted">Choose a market and direction.</pre><button id="buy" class="btn" style="display:none">Buy This Contract</button></div></div></main></div><script>let proposalId=null,askPrice=null;const $=id=>document.getElementById(id);GoonFXMarkets.load($('symbol'),['DIGITEVEN','DIGITODD']);document.querySelectorAll('[data-contract]').forEach(b=>b.onclick=async()=>{const r=$('result'),buy=$('buy');buy.style.display='none';r.textContent='Requesting live proposal…';try{const d=await derivProposal({amount:Number($('stake').value),basis:'stake',contract_type:b.dataset.contract,currency:'USD',duration:Number($('duration').value),duration_unit:'t',underlying_symbol:$('symbol').value});proposalId=d.proposal?.id;askPrice=Number(d.proposal?.ask_price);r.textContent=JSON.stringify(d,null,2);if(proposalId&&Number.isFinite(askPrice)){buy.style.display='inline-block';buy.textContent=`BUY ${b.dataset.contract==='DIGITEVEN'?'EVEN':'ODD'} · ${askPrice}`}}catch(e){r.textContent=e.message}});$('buy').onclick=async()=>{if(!proposalId||!Number.isFinite(askPrice))return;if(!confirm(`Buy this contract for ${askPrice}?`))return;$('result').textContent='Buying…';try{$('result').textContent=JSON.stringify(await derivBuy(proposalId,askPrice),null,2);$('buy').style.display='none'}catch(e){$('result').textContent=e.message}};</script></body></html>
