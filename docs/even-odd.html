<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Even / Odd</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="tools.html">Tools</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Even / Odd</h1><div class="grid"><div class="card form"><label>Symbol<select class="input" id="symbol"><option>R_100</option><option>R_75</option><option>R_50</option><option>R_25</option><option>R_10</option></select></label><label>Stake<input id="stake" class="input" type="number" min="0.35" step="0.01" value="1"></label><div class="actions"><button class="btn" data-contract="DIGITEVEN">Even</button><button class="btn secondary" data-contract="DIGITODD">Odd</button></div></div><div class="card"><h3>Proposal</h3><pre id="result" class="muted">Select Even or Odd to request a live proposal.</pre></div></div></main></div><script>document.querySelectorAll('[data-contract]').forEach(b=>b.onclick=async()=>{const r=document.getElementById('result');r.textContent='Requesting proposal…';try{const d=await api('/api/proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:document.getElementById('symbol').value,contract_type:b.dataset.contract,stake:document.getElementById('stake').value})});r.textContent=JSON.stringify(d,null,2)}catch(e){r.textContent=e.message}})</script></body></html>
