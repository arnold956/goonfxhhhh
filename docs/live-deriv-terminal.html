<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX Live Deriv Terminal</title><style>body{margin:0;background:#070707;color:#fff;font-family:Arial,sans-serif}.top{height:60px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#0d0d0d;border-bottom:1px solid #292929;position:sticky;top:0}.brand{color:#ff2633;font-weight:900;letter-spacing:3px}.sp{flex:1}.top button,.top a,.type button{background:#171717;color:#bbb;border:1px solid #333;border-radius:7px;padding:8px 11px;text-decoration:none;cursor:pointer}.top button.on,.type button.on,.buy{background:#ff2633;color:#fff;border-color:#ff2633}.grid{display:grid;grid-template-columns:210px 1fr 320px;gap:10px;padding:10px;max-width:1600px;margin:auto}.panel{background:#101010;border:1px solid #292929;border-radius:10px}.side{padding:10px;height:calc(100vh - 82px);position:sticky;top:70px}.side button{display:block;width:100%;padding:10px;text-align:left;background:transparent;border:0;color:#aaa;border-radius:7px;cursor:pointer}.side button:hover{background:#1b1b1b;color:#fff}.side h5{color:#666;margin:12px 5px 5px}.bar{display:flex;gap:8px}.bar select,.field input,.field select{flex:1;background:#090909;color:#fff;border:1px solid #333;border-radius:7px;padding:10px}.price{font-size:20px;font-weight:900;padding:8px}.head{padding:11px;border-bottom:1px solid #292929;display:flex;gap:10px}.live{color:#2bd37f;font-weight:bold}.chart{height:440px;display:block;width:100%}.status{padding:9px;color:#999;border-top:1px solid #292929;font-size:12px}.ticket{padding:14px;height:max-content;position:sticky;top:70px}.ticket h2{margin:0}.muted{color:#777;font-size:12px}.families{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}.families button,.type button{background:#171717;color:#bbb;border:1px solid #333;border-radius:7px;padding:8px;cursor:pointer}.families button.on,.type button.on{background:#ff2633;color:#fff}.type{display:flex;flex-wrap:wrap;gap:6px}.field{margin:9px 0}.field label{display:block;color:#999;font-size:11px;margin-bottom:4px}.row{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quote{margin-top:10px;padding:10px;border:1px solid #333;border-radius:8px}.quote b{font-size:21px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:9px}.actions button{padding:12px;border:1px solid #333;border-radius:7px;background:#171717;color:#fff;font-weight:bold}.buy{background:#ff2633!important}.positions{margin-top:10px;padding:12px}.pos{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #242424;font-size:12px}@media(max-width:1050px){.grid{grid-template-columns:180px 1fr}.ticket{grid-column:1/-1;position:static}.side{position:static;height:auto}}@media(max-width:650px){.grid{display:block}.side{margin-bottom:10px}.chart{height:300px}.top a{display:none}}</style></head><body><header class="top"><a class="brand" href="index.html">GOON FX</a><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><span class="sp"></span><button id="demo" class="on">DEMO</button><button id="real">REAL</button><b id="balance">—</b></header><div class="grid"><aside class="panel side"><h5>TRADING</h5><button>Live Deriv Terminal</button><button onclick="location.href='manual-trader.html'">Manual Trader</button><button onclick="location.href='bulk-trader.html'">Bulk Trader</button><button onclick="location.href='portfolio.html'">Portfolio</button><h5>TOOLS</h5><button onclick="location.href='analysis.html'">Analysis Center</button><button onclick="location.href='ai-bot-builder.html'">AI Bot Builder</button></aside><main><section class="panel"><div class="bar"><select id="symbol"><option>Loading active Deriv markets…</option></select><div class="price" id="price">—</div></div><div class="head"><b id="name">Deriv Market</b><span id="live" class="live">● CONNECTING</span><span class="sp"></span><button onclick="historyCount=120;connect()">120</button><button onclick="historyCount=300;connect()">300</button></div><canvas id="chart" class="chart"></canvas><div id="status" class="status">Connecting to Deriv public market feed…</div></section><section class="panel positions"><b>Open Contracts</b><div id="positions" class="muted" style="padding:10px">Sign in with Deriv to load account contracts.</div></section></main><aside class="panel ticket"><h2>Manual Trader</h2><p class="muted">Deriv proposal → buy → live contract</p><div id="account" class="status">Checking account session…</div><div class="families"><button class="on" data-family="digits">DIGITS</button><button data-family="ups">UPS & DOWNS</button><button data-family="touch">TOUCH / NO TOUCH</button><button data-family="multipliers">MULTIPLIERS</button><button data-family="turbos">TURBOS</button><button data-family="vanillas">VANILLAS</button></div><div id="types" class="type"></div><div id="fields"></div><div class="row"><div class="field"><label>Stake</label><input id="stake" type="number" min="0.01" step="0.01" value="1"></div><div class="field"><label>Duration</label><input id="duration" type="number" min="1" value="1"></div></div><div class="field"><label>Unit</label><select id="unit"><option value="t">Ticks</option><option value="s">Seconds</option><option value="m">Minutes</option><option value="h">Hours</option><option value="d">Days</option></select></div><div class="quote"><span class="muted">LIVE PROPOSAL</span><br><b id="payout">—</b><div id="quote" class="muted">No proposal yet.</div></div><div class="actions"><button id="proposal">GET PROPOSAL</button><button id="buy" class="buy" disabled>BUY</button></div></aside></div><script>const API=(window.GOONFX_CONFIG?.BACKEND_URL||'https://api.goonfx.com').replace(/\/$/,'');const PUB='wss://api.derivws.com/trading/v1/options/ws/public';const requestedSymbol=new URLSearchParams(location.search).get('symbol');let ws,symbol=requestedSymbol||'R_100',historyCount=120,prices=[],accounts=[],account=null,real=false,contract='DIGITMATCH',family='digits',proposal=null,retry;const $=x=>document.getElementById(x);const families={digits:[['Matches','DIGITMATCH'],['Differs','DIGITDIFF'],['Even','DIGITEVEN'],['Odd','DIGITODD'],['Over','DIGITOVER'],['Under','DIGITUNDER']],ups:[['Higher','HIGHER'],['Lower','LOWER'],['Up / Down','UPORDOWN']],touch:[['Touch','ONETOUCH'],['No Touch','NOTOUCH']],multipliers:[['Multiplier Up','MULTUP'],['Multiplier Down','MULTDOWN'],['Accumulator','ACCU']],turbos:[['Turbos Long','TURBOSLONG'],['Turbos Short','TURBOSSHORT']],vanillas:[['Call','VANILLALONGCALL'],['Put','VANILLALONGPUT']]};async function api(p,o={}){const r=await fetch(API+p,{...o,credentials:'include',headers:{'Content-Type':'application/json',...(o.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{d={error:t}}if(!r.ok)throw Error(d.error||d.message||('HTTP '+r.status));return d}function renderTypes(){const b=$('types');b.innerHTML='';families[family].forEach(([n,t])=>{const x=document.createElement('button');x.textContent=n;x.className=t===contract?'on':'';x.onclick=()=>{contract=t;renderTypes();renderFields()};b.appendChild(x)});renderFields()}function renderFields(){const f=$('fields');f.innerHTML='';const add=(id,label,value='')=>f.insertAdjacentHTML('beforeend',`<div class="field"><label>${label}</label><input id="${id}" value="${value}"></div>`);if(['DIGITMATCH','DIGITDIFF','DIGITOVER','DIGITUNDER','HIGHER','LOWER','ONETOUCH','NOTOUCH'].includes(contract))add('barrier','Barrier',contract.startsWith('DIGIT')?'5':'');if(['MULTUP','MULTDOWN'].includes(contract))add('multiplier','Multiplier','10');if(contract==='ACCU')add('growth_rate','Growth rate','0.01')}document.querySelectorAll('[data-family]').forEach(x=>x.onclick=()=>{document.querySelectorAll('[data-family]').forEach(y=>y.classList.remove('on'));x.classList.add('on');family=x.dataset.family;contract=families[family][0][1];renderTypes()});function setStatus(t,ok=false){$('status').textContent=t;$('status').style.color=ok?'#55e49a':'#999'}async function loadSymbols(){const s=new WebSocket(PUB);s.onopen=()=>s.send(JSON.stringify({active_symbols:'full',req_id:1}));s.onmessage=e=>{const d=JSON.parse(e.data);if(d.msg_type==='active_symbols'){const a=d.active_symbols||[];const valid=a.filter(x=>x.symbol);$('symbol').innerHTML=valid.map(x=>`<option value="${x.symbol}">${x.display_name||x.symbol}</option>`).join('');const wanted=valid.find(x=>x.symbol===requestedSymbol);const p=wanted||valid.find(x=>x.symbol==='R_100')||valid.find(x=>x.symbol==='1HZ100V')||valid[0];if(p){symbol=p.symbol;$('symbol').value=symbol;connect()}setStatus(`LIVE Deriv market directory · ${valid.length} active symbols`,true);s.close()}};s.onerror=()=>setStatus('Could not load Deriv active symbols')}function connect(){if(ws)try{ws.close()}catch{};clearTimeout(retry);prices=[];$('live').textContent='● CONNECTING';ws=new WebSocket(PUB);ws.onopen=()=>{ws.send(JSON.stringify({ticks_history:symbol,count:historyCount,end:'latest',style:'ticks',req_id:10}));ws.send(JSON.stringify({ticks:symbol,subscribe:1,req_id:11}))};ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.error){setStatus('Deriv error: '+d.error.message);return}if(d.msg_type==='history'){prices=(d.history.prices||[]).map(Number);draw()}if(d.msg_type==='tick'){const q=Number(d.tick.quote);prices.push(q);if(prices.length>historyCount)prices.shift();$('price').textContent=q;$('name').textContent=$('symbol').selectedOptions[0]?.textContent||symbol;$('live').textContent='● LIVE';setStatus(`LIVE tick stream · ${symbol}`,true);draw()}};ws.onclose=()=>{clearTimeout(retry);$('live').textContent='● RECONNECTING';retry=setTimeout(connect,1500)};ws.onerror=()=>setStatus('Live Deriv stream error — reconnecting…')}$('symbol').onchange=e=>{symbol=e.target.value;connect()};function draw(){const c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);if(prices.length<2)return;const min=Math.min(...prices),max=Math.max(...prices),range=max-min||1,p=18;x.strokeStyle='#1b1b1b';for(let i=0;i<6;i++){const y=p+i*(r.height-2*p)/5;x.beginPath();x.moveTo(0,y);x.lineTo(r.width,y);x.stroke()}x.beginPath();prices.forEach((v,i)=>{const xx=p+i*(r.width-2*p)/(prices.length-1),yy=r.height-p-(v-min)/range*(r.height-2*p);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.strokeStyle='#ff2633';x.lineWidth=2;x.stroke()}async function loadAccount(){try{const d=await api('/api/account');accounts=d.accounts||[];account=accounts.find(a=>String(a.account_type||a.type||'').toLowerCase().includes('demo'))||accounts[0];showAccount();loadPositions()}catch{$('account').textContent='Not connected. Open Account → Connect Deriv.'}}function showAccount(){if(!account)return;$('account').textContent=`${real?'REAL':'DEMO'} · ${account.account_id||'—'} · ${account.balance??'—'} ${account.currency||''}`;$('balance').textContent=`${account.balance??'—'} ${account.currency||''}`}async function switchAccount(){const wanted=real?'real':'demo';const a=accounts.find(x=>String(x.account_type||x.type||'').toLowerCase().includes(wanted));if(a){account=a;showAccount();loadPositions()}else $('account').textContent=`No ${wanted} account is available in this session.`}$('demo').onclick=()=>{real=false;$('demo').classList.add('on');$('real').classList.remove('on');switchAccount()};$('real').onclick=()=>{real=true;$('real').classList.add('on');$('demo').classList.remove('on');switchAccount()};async function loadPositions(){if(!account)return;try{const d=await api('/api/portfolio',{method:'POST',body:JSON.stringify({account_id:account.account_id})});const a=d.portfolio?.contracts||d.contracts||[];$('positions').innerHTML=a.length?a.map(c=>`<div class="pos"><span>${c.contract_type||'Contract'} #${c.contract_id||''}</span><b>${c.profit??'—'}</b></div>`).join(''):'<div class="muted">No open contracts.</div>'}catch{}}$('proposal').onclick=async()=>{try{if(!account)throw Error('Connect Deriv first');const body={account_id:account.account_id,symbol,contract_type:contract,stake:Number($('stake').value),currency:account.currency||'USD',duration:Number($('duration').value),duration_unit:$('unit').value};['barrier','multiplier','growth_rate'].forEach(k=>{const e=$(k);if(e&&e.value)body[k]=['multiplier','growth_rate'].includes(k)?Number(e.value):e.value});const d=await api('/api/proposal',{method:'POST',body:JSON.stringify(body)});proposal=d.proposal||d;$('payout').textContent=proposal.payout??proposal.ask_price??'—';$('quote').textContent=`Ask ${proposal.ask_price??'—'} · Spot ${proposal.spot??'—'}`;$('buy').disabled=!(proposal.id||proposal.proposal_id)}catch(e){$('quote').textContent=e.message}};$('buy').onclick=async()=>{if(!proposal)return;try{if(real&&!confirm('REAL account selected. Confirm this trade?'))return;const d=await api('/api/buy',{method:'POST',body:JSON.stringify({account_id:account.account_id,proposal_id:proposal.id||proposal.proposal_id,price:Number(proposal.ask_price||$('stake').value)})});$('quote').textContent=`Purchased · ${d.buy?.contract_id||d.contract_id||'submitted'}`;$('buy').disabled=true;loadPositions()}catch(e){$('quote').textContent=e.message}};renderTypes();loadSymbols();loadAccount();window.onresize=draw;</script></body></html>
