<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Manual Trader</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script><style>.trade-wrap{max-width:1200px;margin:auto}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}.tabs button{background:#171717;color:#fff;border:1px solid #333;padding:11px 15px;border-radius:10px;cursor:pointer}.tabs button.active{background:#e11;color:#fff;border-color:#e11}.panel{display:none}.panel.active{display:block}.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}.field label{display:block;margin-bottom:6px;font-size:.85rem;color:#aaa}.field input,.field select{width:100%;box-sizing:border-box;background:#101010;color:#fff;border:1px solid #333;border-radius:9px;padding:11px}.quote{margin-top:18px;padding:18px;border:1px solid #292929;border-radius:14px;background:#111}.buy{background:#d71920;color:white;border:0}.notice{padding:12px;border-radius:10px;background:#211;color:#f77;margin-bottom:14px}.section-title{margin-top:28px}</style></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a class="active" href="manual-trader.html">Manual Trader</a><a href="tools.html">Tools</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container trade-wrap"><section class="hero"><h1>Manual Trader</h1><p class="muted">Choose a Deriv contract family, configure it, request a live proposal, then buy it from the authenticated account.</p><div id="notice" class="notice">Connect Deriv and select an account before trading.</div><div class="card"><div class="formgrid"><div class="field"><label>Account</label><select id="account"><option value="">Connect Deriv first</option></select></div><div class="field"><label>Market / Symbol</label><select id="symbol"><option>R_100</option><option>R_75</option><option>R_50</option><option>R_25</option><option>R_10</option><option>1HZ100V</option><option>1HZ75V</option><option>1HZ50V</option><option>1HZ25V</option><option>1HZ10V</option></select></div><div class="field"><label>Stake</label><input id="stake" type="number" min="0.01" step="0.01" value="1"></div><div class="field"><label>Currency</label><input id="currency" value="USD"></div><div class="field"><label>Duration</label><input id="duration" type="number" min="1" value="1"></div><div class="field"><label>Duration unit</label><select id="unit"><option value="t">Ticks</option><option value="s">Seconds</option><option value="m">Minutes</option><option value="h">Hours</option><option value="d">Days</option></select></div></div></div><h2 class="section-title">Contract family</h2><div class="tabs"><button class="active" data-family="digits">DIGITS</button><button data-family="ups">UPS AND DOWNS</button><button data-family="touch">TOUCH / NO TOUCH</button><button data-family="multipliers">MULTIPLIERS</button><button data-family="turbos">TURBOS</button><button data-family="vanillas">VANILLAS</button></div><div class="panel active" id="digits"><div class="tabs"><button class="active type" data-type="DIGITMATCH">Matches</button><button class="type" data-type="DIGITDIFF">Differs</button><button class="type" data-type="DIGITEVEN">Even</button><button class="type" data-type="DIGITODD">Odd</button><button class="type" data-type="DIGITOVER">Over</button><button class="type" data-type="DIGITUNDER">Under</button></div><div class="field"><label>Prediction / barrier (for Matches, Differs, Over, Under)</label><input id="barrier" type="text" placeholder="e.g. 5"></div></div><div class="panel" id="ups"><div class="tabs"><button class="active type" data-type="HIGHER">Higher</button><button class="type" data-type="LOWER">Lower</button><button class="type" data-type="UPORDOWN">Up / Down</button></div><div class="field"><label>Barrier (Higher / Lower)</label><input id="barrier2" type="text" placeholder="e.g. +0.1"></div></div><div class="panel" id="touch"><div class="tabs"><button class="active type" data-type="ONETOUCH">Touch</button><button class="type" data-type="NOTOUCH">No Touch</button></div><div class="field"><label>Barrier</label><input id="touchBarrier" type="text" placeholder="Barrier"></div></div><div class="panel" id="multipliers"><div class="tabs"><button class="active type" data-type="MULTUP">Multiplier Up</button><button class="type" data-type="MULTDOWN">Multiplier Down</button><button class="type" data-type="ACCU">Accumulator</button></div><div class="formgrid"><div class="field"><label>Multiplier / Growth rate</label><input id="multiplier" type="number" min="1" step="1" value="10"></div><div class="field"><label>Growth rate (Accumulator)</label><input id="growth" type="number" min="0" step="0.01" placeholder="Optional"></div></div></div><div class="panel" id="turbos"><div class="tabs"><button class="active type" data-type="TURBOSLONG">Turbos Long</button><button class="type" data-type="TURBOSSHORT">Turbos Short</button></div></div><div class="panel" id="vanillas"><div class="tabs"><button class="active type" data-type="VANILLALONGCALL">Call</button><button class="type" data-type="VANILLALONGPUT">Put</button></div></div><div class="quote"><div id="quote">No proposal yet.</div><div class="actions" style="margin-top:14px"><button class="btn" id="proposalBtn">Get Live Proposal</button><button class="btn buy" id="buyBtn" disabled>Buy Contract</button></div></div></section></main></div><script>let currentType='DIGITMATCH',proposalId=null,proposalPrice=null;const $=id=>document.getElementById(id);function setNotice(t,ok=false){$('notice').textContent=t;$('notice').style.color=ok?'#8f8':'#f77'}function payload(){const p={account_id:$('account').value,symbol:$('symbol').value,contract_type:currentType,stake:Number($('stake').value),currency:$('currency').value,duration:Number($('duration').value),duration_unit:$('unit').value};const b=$('barrier').value||$('barrier2').value||$('touchBarrier').value;if(b)p.barrier=b;if($('multiplier').value&&['MULTUP','MULTDOWN'].includes(currentType))p.multiplier=Number($('multiplier').value);if($('growth').value&&currentType==='ACCU')p.growth_rate=Number($('growth').value);return p}async function load(){try{const d=await goonfxApi('/api/account');const s=$('account');s.innerHTML='';d.accounts.forEach(a=>{const o=document.createElement('option');o.value=a.account_id;o.textContent=`${a.account_id} · ${a.currency||''} · ${a.status||''}`;s.appendChild(o)});setNotice('Deriv account connected. Choose Demo or Real above if multiple accounts are available.',true)}catch{setNotice('Connect Deriv first.')}}document.querySelectorAll('[data-family]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-family]').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');$(b.dataset.family).classList.add('active')});document.querySelectorAll('.type').forEach(b=>b.onclick=()=>{b.parentElement.querySelectorAll('.type').forEach(x=>x.classList.remove('active'));b.classList.add('active');currentType=b.dataset.type});$('proposalBtn').onclick=async()=>{try{if(!$('account').value)throw Error('Select a Deriv account');const d=await goonfxApi('/api/proposal',{method:'POST',body:JSON.stringify(payload())});proposalId=d.proposal?.id||d.proposal?.proposal_id||d.id;proposalPrice=Number(d.proposal?.ask_price??d.proposal?.display_value??d.ask_price??$('stake').value);$('quote').textContent=`Live proposal received · ${JSON.stringify(d.proposal||d).slice(0,700)}`;$('buyBtn').disabled=!proposalId;setNotice('Live Deriv proposal received.',true)}catch(e){setNotice(e.message)}};$('buyBtn').onclick=async()=>{try{const d=await goonfxApi('/api/buy',{method:'POST',body:JSON.stringify({account_id:$('account').value,proposal_id:proposalId,price:proposalPrice})});$('quote').textContent='Contract purchased: '+JSON.stringify(d).slice(0,900);setNotice('Trade submitted to Deriv.',true)}catch(e){setNotice(e.message)}};load();</script></body></html>
