<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Live Deriv Markets</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script><style>.market-toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.market-toolbar button{background:#11171b;color:#fff;border:1px solid #30383f;border-radius:8px;padding:11px 13px;cursor:pointer}.market-toolbar button.active{border-color:#21d86b}.market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:12px}.market-card{background:#0d1216;border:1px solid #293138;border-radius:12px;padding:16px;cursor:pointer}.market-card:hover{border-color:#21d86b}.market-card h3{margin:0 0 7px}.market-card small{color:#8e999f}.live{color:#20d96b;font-weight:800;margin-top:12px}.empty{padding:30px;color:#9aa3a8}.badge{display:inline-block;margin:3px 4px 0 0;padding:3px 7px;border:1px solid #30383f;border-radius:99px;font-size:11px;color:#aeb7bc}</style></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a class="active" href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="bulk-trader.html">Bulk Trader</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Live Deriv Markets</h1><p class="muted">Live catalogue directly from Deriv. No hard-coded symbol list.</p><div class="market-toolbar" id="filters"><button class="active" data-group="all">All</button><button id="reload">Refresh</button></div><div id="status" class="muted">Connecting to Deriv…</div><section id="grid" class="market-grid"></section></main></div><script>const WS_URL='wss://ws.binaryws.com/websockets/v3';let markets=[],group='all',socket=null,req=0;const grid=document.getElementById('grid'),status=document.getElementById('status'),filters=document.getElementById('filters');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function normal(m){return{symbol:m.underlying_symbol||m.symbol,name:m.underlying_symbol_name||m.display_name||m.underlying_symbol||m.symbol,type:m.underlying_symbol_type||m.symbol_type||'',market:m.market||'other',submarket:m.submarket||m.subgroup||'',pip:m.pip_size??m.pip,open:m.exchange_is_open, suspended:m.is_trading_suspended}}function classify(m){const s=(m.market+' '+m.submarket+' '+m.type+' '+m.name+' '+m.symbol).toLowerCase();if(/synthetic|indices|volatility|crash|boom|jump|step|drift|range|daily|basket/.test(s))return'synthetic';if(/forex|currency/.test(s))return'forex';if(/crypto/.test(s))return'crypto';if(/commodity/.test(s))return'commodities';if(/stock|index/.test(s))return'indices';return m.market||'other'}function rebuildFilters(){const cats=[...new Set(markets.map(m=>m.market||'other').filter(Boolean))].sort();filters.innerHTML='<button class="active" data-group="all">All</button>'+cats.map(c=>`<button data-group="${esc(c)}">${esc(c.replace(/_/g,' '))}</button>`).join('')+'<button id="reload">Refresh</button>';filters.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{filters.querySelectorAll('[data-group]').forEach(x=>x.classList.remove('active'));b.classList.add('active');group=b.dataset.group;render()});document.getElementById('reload').onclick=load}function render(){const list=markets.filter(m=>group==='all'||m.market===group);grid.innerHTML=list.length?list.map(m=>`<article class="market-card" onclick="openMarket('${encodeURIComponent(m.symbol)}')"><h3>${esc(m.name)}</h3><small>${esc(m.symbol)} · ${esc(m.type||'market')} · ${esc(m.submarket||'')}</small><div>${m.open===0?'CLOSED':'OPEN'} ${m.suspended?'· SUSPENDED':''}</div><div class="live">● LIVE MARKET</div><div><span class="badge">${esc(m.market)}</span><span class="badge">${esc(m.submarket||'')}</span></div></article>`).join(''):'<div class="empty">Deriv returned no active symbols for this category.</div>'}function openMarket(s){location.href='trade.html?symbol='+s}function load(){status.textContent='Connecting to Deriv live market feed…';if(socket)try{socket.close()}catch{}socket=new WebSocket(WS_URL);socket.onopen=()=>socket.send(JSON.stringify({active_symbols:'full',req_id:++req}));socket.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.error){status.textContent='Deriv market feed error: '+d.error.message;return}if(d.msg_type==='active_symbols'){markets=(d.active_symbols||[]).map(normal).filter(m=>m.symbol);status.textContent=`${markets.length} live Deriv symbols`;rebuildFilters();render()}};socket.onerror=()=>status.textContent='Unable to connect to Deriv live market feed.';socket.onclose=()=>{if(document.visibilityState!=='hidden')setTimeout(()=>load(),5000)}}document.getElementById('reload').onclick=load;load();</script></body></html>
