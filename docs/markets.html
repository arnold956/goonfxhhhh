<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Live Deriv Markets</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script><style>.market-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.market-toolbar button{background:#11171b;color:#fff;border:1px solid #30383f;border-radius:8px;padding:11px 14px;cursor:pointer}.market-toolbar button.active{border-color:#21d86b}.market-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}.market-card{background:#0d1216;border:1px solid #293138;border-radius:12px;padding:16px;cursor:pointer}.market-card:hover{border-color:#21d86b;transform:translateY(-1px)}.market-card h3{margin:0 0 8px}.market-card small{color:#8e999f}.market-card .live{color:#20d96b;font-weight:800;margin-top:12px}.empty{padding:30px;color:#9aa3a8}</style></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="index.html">Home</a><a href="dashboard.html">Dashboard</a><a class="active" href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="bulk-trader.html">Bulk Trader</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Live Deriv Markets</h1><p class="muted">Live market directory from Deriv. Select a market to open the trading terminal.</p><div class="market-toolbar"><button class="active" data-group="all">All</button><button data-group="synthetic">Synthetic Indices</button><button data-group="forex">Forex</button><button data-group="crypto">Crypto</button><button data-group="commodities">Commodities</button><button data-group="indices">Indices</button><button id="reload">Refresh</button></div><div id="status" class="muted">Loading live symbols…</div><section id="grid" class="market-grid"></section></main></div><script>const API=String(window.GOONFX_CONFIG?.BACKEND_URL||'https://api.goonfx.com').replace(/\/$/,'');let markets=[],group='all';const grid=document.getElementById('grid'),status=document.getElementById('status');function classify(m){const s=((m.display_name||'')+' '+(m.symbol||'')).toLowerCase();if(/volatility|boom|crash|jump|step|drift|range break|daily reset|basket|treasure|bull market|bear market/.test(s))return 'synthetic';if(/forex|usd|eur|gbp|jpy|aud|cad|chf|nzd|zar|sek|nok|sgd|hkd|mxn|try|pln/.test(s))return 'forex';if(/crypto|bitcoin|ethereum|litecoin|dogecoin|solana|ripple|cardano|polkadot/.test(s))return 'crypto';if(/gold|silver|oil|brent|wti|commodity/.test(s))return 'commodities';if(/index|indices|nasdaq|dow jones|s&p|dax|ftse|nikkei|hang seng/.test(s))return 'indices';return 'other'}function render(){const list=markets.filter(m=>group==='all'||classify(m)===group);grid.innerHTML=list.length?list.map(m=>`<article class="market-card" data-symbol="${m.symbol}"><h3>${m.display_name||m.symbol}</h3><small>${m.symbol} · ${classify(m)}</small><div class="live">● LIVE MARKET</div></article>`).join(''):'<div class="empty">No markets found in this category.</div>';grid.querySelectorAll('.market-card').forEach(c=>c.onclick=()=>location.href='trade.html?symbol='+encodeURIComponent(c.dataset.symbol))}async function load(){status.textContent='Loading live symbols…';try{const r=await fetch(API+'/api/markets',{cache:'no-store'});const d=await r.json();if(!r.ok)throw Error(d.error||'Market request failed');markets=d.markets||d.active_symbols||[];status.textContent=`${markets.length} live Deriv symbols available`;render()}catch(e){status.textContent='Unable to load live Deriv markets: '+e.message;grid.innerHTML='<div class="empty">Check the GOON FX API connection and try again.</div>'}}document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-group]').forEach(x=>x.classList.remove('active'));b.classList.add('active');group=b.dataset.group;render()});document.getElementById('reload').onclick=load;load();</script></body></html>
