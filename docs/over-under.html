<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Over / Under</title><style>body{margin:0;background:#07090b;color:#fff;font:14px Arial}.nav{display:flex;gap:18px;padding:16px;background:#0d1115;border-bottom:1px solid #293139;flex-wrap:wrap}.nav a{color:#aaa;text-decoration:none}.wrap{max-width:1400px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:1fr 350px;gap:15px}.panel{background:#0d1115;border:1px solid #293139;border-radius:12px;padding:16px}.chart{width:100%;height:390px;background:#080b0e;border-radius:8px}.input,select{width:100%;box-sizing:border-box;background:#11161b;color:#fff;border:1px solid #39424a;border-radius:8px;padding:11px;margin:7px 0 12px}.btn{width:100%;padding:14px;border:0;border-radius:8px;color:#fff;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.over{background:#159447}.under{background:#d92731}.result{margin-top:12px;padding:12px;border-radius:8px;background:#151a1f}.ok{border:1px solid #194d31;color:#8ff0b5}.bad{border:1px solid #7c2630;color:#ff9ba3}.digits{display:grid;grid-template-columns:repeat(10,1fr);gap:7px;margin-top:15px}.digit{text-align:center;padding:6px;border-radius:9px}.circle{margin:5px auto;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;border:2px solid #5b6570;font-weight:900;font-size:20px}.hot .circle{border-color:#24df68}.cold .circle{border-color:#ff3943}.cursor{height:8px;background:#222a30;border-radius:99px;position:relative;margin:18px 0}.cursor i{position:absolute;top:-5px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 0 12px #fff;transform:translateX(-50%);transition:left .25s}.signal{font-weight:900;margin:8px 0}.muted{color:#89949c;font-size:12px}@media(max-width:850px){.grid{grid-template-columns:1fr}.digits{grid-template-columns:repeat(5,1fr)}}</style><script src="config.js"></script><script src="market-loader.js"></script><script src="app.js"></script></head><body><nav class="nav"><a href="index.html">GOON FX</a><a href="dashboard.html">Dashboard</a><a href="digits.html">Digits</a><a href="over-under.html">Over & Under</a><a href="even-odd.html">Even & Odd</a><a href="rise-fall.html">Rise & Fall</a><a href="accumulators.html">Accumulators</a><a href="manual-trader.html">Manual</a><a href="bulk-trader.html">Bulk</a></nav><main class="wrap"><div class="grid"><section class="panel"><select id="symbol"><option value="">Loading compatible markets…</option></select><div>● <span id="feed">CONNECTING</span> · Last digit: <b id="last">-</b> · Quote: <b id="quote">-</b></div><canvas id="chart" class="chart"></canvas><div class="cursor"><i id="cursor"></i></div><div id="signal" class="signal">Analysing live ticks…</div><div id="digits" class="digits"></div><p class="muted">Live frequency and cursor are analysis aids only; they do not guarantee the next digit.</p></section><aside class="panel"><h2>Over / Under</h2><label>Barrier (0–9)</label><input id="barrier" class="input" type="number" min="0" max="9" value="5"><label>Stake</label><input id="stake" class="input" type="number" min="0.35" step="0.01" value="1"><label>Duration</label><select id="duration"><option value="1">1 Tick</option><option value="2">2 Ticks</option><option value="3">3 Ticks</option><option value="5">5 Ticks</option><option value="10">10 Ticks</option></select><button class="btn over" id="overBtn">TRADE OVER</button><button class="btn under" id="underBtn" style="margin-top:8px">TRADE UNDER</button><div id="result" class="result">Checking your Deriv connection…</div></aside></div></main><script>const PUB='wss://api.derivws.com/trading/v1/options/ws/public',$=x=>document.getElementById(x);let symbol='',prices=[],ticks=[],ws;const loader=window.GoonFXMarkets;async function loadMarkets(){if(!loader)return;$('result').textContent='Loading compatible Deriv markets…';await loader.load($('symbol'),['DIGITOVER','DIGITUNDER'])}$('symbol').onchange=e=>{symbol=e.target.value;connect()};function lastDigit(v){const m=String(v).match(/(\d)$/);return m?+m[1]:null}function render(){const c=Array(10).fill(0);ticks.forEach(v=>{const d=lastDigit(v);if(d!==null)c[d]++});const total=Math.max(1,ticks.length),bar=Math.max(0,Math.min(9,Number($('barrier').value)));$('digits').innerHTML=c.map((n,i)=>`<div class="digit ${i>bar?'hot':'cold'}"><small>${(n/total*100).toFixed(1)}%</small><div class="circle">${i}</div><small>${i>bar?'OVER':i<bar?'UNDER':'BARRIER'}</small></div>`).join('');const cur=lastDigit(ticks[ticks.length-1]);$('cursor').style.left=(cur===null?50:cur/9*100)+'%';const over=c.slice(bar+1).reduce((a,b)=>a+b,0)/total*100,under=c.slice(0,bar).reduce((a,b)=>a+b,0)/total*100;$('signal').textContent=`Live analysis · Over ${over.toFixed(1)}% · Under ${under.toFixed(1)}% · Cursor ${cur??'—'}`}function draw(){const c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);if(prices.length<2)return;const mn=Math.min(...prices),mx=Math.max(...prices),rg=mx-mn||1;x.beginPath();prices.forEach((v,i)=>{const xx=5+i*(r.width-10)/(prices.length-1),yy=r.height-8-(v-mn)/rg*(r.height-16);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.strokeStyle='#24df68';x.lineWidth=2;x.stroke()}function connect(){if(!symbol)return;try{ws?.close()}catch{}ticks=[];prices=[];ws=new WebSocket(PUB);ws.onopen=()=>{ws.send(JSON.stringify({ticks_history:symbol,count:150,end:'latest',style:'ticks'}));ws.send(JSON.stringify({ticks:symbol,subscribe:1}))};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.error){$('feed').textContent='MARKET ERROR';return}if(d.history){prices=(d.history.prices||[]).map(Number);ticks=prices.slice(-100);$('feed').textContent='LIVE · DERIV';render();draw()}if(d.tick){const q=Number(d.tick.quote);prices.push(q);ticks.push(q);prices=prices.slice(-150);ticks=ticks.slice(-100);$('quote').textContent=q;$('last').textContent=lastDigit(q)??'-';$('feed').textContent='LIVE · DERIV';render();draw()}};ws.onclose=()=>{$('feed').textContent='RECONNECTING';setTimeout(connect,1500)}}async function execute(contract){const btn=$(contract==='DIGITOVER'?'overBtn':'underBtn');try{btn.disabled=true;btn.textContent='CHECKING ACCOUNT…';const a=await window.goonfxBackend('/api/account');const account=a?.account;if(!account?.account_id)throw Error('Your Deriv session is not available. Click Login with Deriv and return to this page.');if(!symbol)throw Error('Select a compatible Deriv market first.');const payload={contract_type:contract,underlying_symbol:symbol,amount:Number($('stake').value),duration:Number($('duration').value),duration_unit:'t',barrier:String(Math.max(0,Math.min(9,Number($('barrier').value))))};btn.textContent='GETTING PROPOSAL…';const pr=await window.goonfxBackend('/api/proposal',{method:'POST',body:JSON.stringify(payload)});const p=pr?.proposal;if(!p?.id||!Number(p.ask_price))throw Error('Deriv did not return a valid proposal for this market.');if(String(account.account_type).toLowerCase()==='real'&&!confirm(`REAL ACCOUNT\n\n${contract==='DIGITOVER'?'OVER':'UNDER'} ${payload.barrier}\n${symbol}\nStake: ${payload.amount}\n\nPlace this real-money trade?`))return;btn.textContent='PLACING TRADE…';const b=await window.goonfxBackend('/api/buy',{method:'POST',body:JSON.stringify({proposal_id:p.id,price:Number(p.ask_price)})});if(!b?.buy?.contract_id)throw Error('Deriv did not confirm the purchase.');$('result').className='result ok';$('result').textContent=`TRADE EXECUTED · ${b.buy.contract_id}`;await window.goonfxBackend('/api/account')}catch(e){$('result').className='result bad';$('result').textContent=e.message||'Trade failed.'}finally{btn.disabled=false;btn.textContent=contract==='DIGITOVER'?'TRADE OVER':'TRADE UNDER'}}$('overBtn').onclick=()=>execute('DIGITOVER');$('underBtn').onclick=()=>execute('DIGITUNDER');$('barrier').oninput=render;window.onresize=draw;loadMarkets();window.goonfxBackend('/api/account').then(()=>{$('result').textContent='Deriv connected · ready to trade'}).catch(()=>{$('result').textContent='Login with Deriv to trade.'});render();</script></body></html>
