<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Over / Under</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="app"><nav class="nav"><b class="brand">GOON FX</b><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="trade.html">Trade</a><a href="tools.html">Tools</a><a href="portfolio.html">Portfolio</a><a href="account.html">Account</a></div></nav><main class="container"><h1>Over / Under</h1><div class="grid"><div class="card form"><label>Symbol<select class="input" id="symbol"><option>R_100</option><option>R_75</option><option>R_50</option><option>R_25</option><option>R_10</option></select></label><label>Digit<input id="barrier" class="input" type="number" min="0" max="9" value="5"></label><label>Stake<input id="stake" class="input" type="number" min="0.35" step="0.01" value="1"></label><div class="actions"><button class="btn" data-contract="DIGITOVER">Over</button><button class="btn secondary" data-contract="DIGITUNDER">Under</button></div></div><div class="card"><h3>Live Proposal</h3><pre id="result" class="muted">Connect Deriv, then request a proposal.</pre><button id="buy" class="btn" style="display:none">Buy This Contract</button></div></div></main></div><script>let proposalId=null,askPrice=null;document.querySelectorAll('[data-contract]').forEach(b=>b.onclick=async()=>{const r=document.getElementById('result'),buy=document.getElementById('buy');buy.style.display='none';r.textContent='Requesting live proposal…';try{const d=await api('/api/proposal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({symbol:document.getElementById('symbol').value,contract_type:b.dataset.contract,barrier:document.getElementById('barrier').value,stake:document.getElementById('stake').value})});proposalId=d.proposal?.id;askPrice=Number(d.proposal?.ask_price);r.textContent=JSON.stringify(d,null,2);if(proposalId&&Number.isFinite(askPrice)){buy.style.display='inline-block';buy.textContent=`Buy for ${askPrice}`}}catch(e){r.textContent=e.message}});document.getElementById('buy').onclick=async()=>{if(!proposalId||!Number.isFinite(askPrice))return;if(!confirm(`Buy this contract for ${askPrice}?`))return;const r=document.getElementById('result');r.textContent='Buying…';try{const d=await api('/api/buy',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({proposal_id:proposalId,price:askPrice})});r.textContent=JSON.stringify(d,null,2);document.getElementById('buy').style.display='none'}catch(e){r.textContent=e.message}};</script></body></html>
