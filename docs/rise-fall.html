<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX · Rise & Fall</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="live-deriv-feed.js"></script><script src="app.js" defer></script><style>.wrap{max-width:1400px;margin:auto;padding:20px}.grid{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px}.card{background:#0d1115;border:1px solid #293139;border-radius:12px;padding:16px}.chart{width:100%;height:430px;background:#080b0e}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tradebtn{padding:15px;border:0;border-radius:8px;color:white;font-weight:900;cursor:pointer}.rise{background:#159447}.fall{background:#d92731}.input,select{width:100%;box-sizing:border-box;background:#11161b;color:#fff;border:1px solid #39424a;border-radius:8px;padding:11px;margin:7px 0 14px}.status{margin-top:12px;padding:12px;border-radius:8px;background:#151a1f}.live{color:#20dc79;font-weight:800}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><nav class="nav"><a class="brand" href="index.html">GOON FX</a><div class="navlinks"><a href="dashboard.html">Dashboard</a><a href="markets.html">Markets</a><a href="digits.html">Digits</a><a href="over-under.html">Over/Under</a><a href="even-odd.html">Even/Odd</a><a href="rise-fall.html">Rise/Fall</a><a href="manual-trader.html">Manual</a><a href="bulk-trader.html">Bulk</a></div></nav><main class="wrap"><div class="grid"><section class="card"><div class="live">● LIVE DERIV MARKET</div><h1 id="name">Rise & Fall</h1><p>Live price chart and authenticated Deriv execution.</p><select id="symbol"><option value="1HZ100V">Volatility 100 (1s)</option><option value="1HZ75V">Volatility 75 (1s)</option><option value="1HZ50V">Volatility 50 (1s)</option><option value="1HZ25V">Volatility 25 (1s)</option><option value="1HZ10V">Volatility 10 (1s)</option></select><div>Quote: <b id="quote">—</b> · Last digit: <b id="last">—</b></div><canvas id="chart" class="chart"></canvas></section><aside class="card"><h2>Rise / Fall</h2><label>Stake</label><input id="stake" class="input" type="number" min="0.01" step="0.01" value="1"><label>Duration</label><select id="duration" class="input"><option value="1">1 Tick</option><option value="5">5 Ticks</option><option value="10">10 Ticks</option></select><div class="actions"><button class="tradebtn rise" id="rise">RISE</button><button class="tradebtn fall" id="fall">FALL</button></div><div id="status" class="status">Login with Deriv to trade.</div></aside></div></main><script>const API=(window.GOONFX_CONFIG?.BACKEND_URL||'https://api.goonfx.com').replace(/\/$/,''),$=id=>document.getElementById(id);let prices=[],ws;function canonical(s){return s||'1HZ100V'}function chart(){const c=$('chart'),r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=r.height*d;const x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);x.clearRect(0,0,r.width,r.height);if(prices.length<2)return;const mn=Math.min(...prices),mx=Math.max(...prices),rg=mx-mn||1;x.beginPath();prices.forEach((v,i)=>{const xx=8+i*(r.width-16)/(prices.length-1),yy=r.height-10-(v-mn)/rg*(r.height-20);i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.strokeStyle='#20dc79';x.lineWidth=2;x.stroke()}function connect(){try{ws?.close()}catch{}prices=[];ws=new WebSocket('wss://api.derivws.com/trading/v1/options/ws/public');ws.onopen=()=>{const s=canonical($('symbol').value);ws.send(JSON.stringify({ticks_history:s,count:150,end:'latest',style:'ticks'}));ws.send(JSON.stringify({ticks:s,subscribe:1}))};ws.onmessage=e=>{let d;try{d=JSON.parse(e.data)}catch{return}if(d.error){$('status').textContent=d.error.message;return}if(d.history)prices=(d.history.prices||[]).map(Number);if(d.tick){const q=Number(d.tick.quote);prices.push(q);prices=prices.slice(-150);$('quote').textContent=q;$('last').textContent=String(q).replace(/\D/g,'').slice(-1)}chart()}}async function trade(ct){const s=$('status');try{const r=await fetch(API+'/api/account',{credentials:'include'});const d=await r.json();const a=d.account;if(!a)throw Error('Connect Deriv first.');if(String(a.mode).toUpperCase()==='REAL'&&!confirm('REAL ACCOUNT: use your real Deriv balance for this trade?'))return;s.textContent='Getting live proposal…';const body={account_id:a.account_id,contract_type:ct,underlying_symbol:$('symbol').value,amount:Number($('stake').value),stake:Number($('stake').value),duration:Number($('duration').value),duration_unit:'t'};const p=await fetch(API+'/api/proposal',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const q=await p.json();if(!p.ok)throw Error(q.error||'Proposal failed');const pr=q.proposal||q;if(!pr.id)throw Error('No Deriv proposal returned');s.textContent='Placing trade…';const b=await fetch(API+'/api/buy',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({proposal_id:pr.id,price:Number(pr.ask_price)})});const out=await b.json();if(!b.ok)throw Error(out.error||'Trade failed');s.textContent='TRADE EXECUTED · Contract '+(out.buy?.contract_id||out.contract_id||'confirmed')}catch(e){s.textContent='Trade failed: '+e.message}}$('rise').onclick=()=>trade('CALL');$('fall').onclick=()=>trade('PUT');$('symbol').onchange=connect;addEventListener('resize',chart);connect();</script></body></html>
