<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GOON FX Markets</title><link rel="stylesheet" href="styles.css"><script src="config.js"></script><script src="app.js" defer></script></head><body><div class="app"><nav class="nav"><a class="brand" href="dashboard.html">GOON FX</a><div class="navlinks"><a data-nav href="dashboard.html">Dashboard</a><a data-nav href="markets.html">Markets</a><a data-nav href="trade.html">Trade</a><a data-nav href="portfolio.html">Portfolio</a><a data-nav href="account.html">Account</a><a data-nav href="settings.html">Settings</a><a data-nav href="about.html">About</a></div><div class="spacer"></div><span id="connection-status" class="status"><span class="dot"></span>Checking</span></nav><div class="topbar"><span class="currency">KSH&nbsp; USD</span><span class="cashier">Cashier</span><span class="spacer"></span><button class="deposit" onclick="location.href='account.html'">Deposit</button><span class="balance" data-balance>— KES</span></div><main class="container"><div class="page-head"><h1>Markets</h1><a class="btn" href="trade.html">▶ Trade</a></div><div class="card"><h3>Live Deriv Markets</h3><p class="muted">Choose any available market. The list comes directly from Deriv.</p><div id="market-list" class="grid" style="margin-top:16px"><div class="card"><b>Loading markets…</b><p class="muted">Connecting to Deriv.</p></div></div></div></main><button class="risk">Risk Disclaimer</button><button class="ai" onclick="location.href='analysis.html'">AI</button></div><script>(function(){const box=document.getElementById('market-list');const names={forex:'Forex',crypto:'Crypto',commodities:'Commodities',indices:'Indices',synthetic_index:'Synthetic Indices',stocks:'Stocks',stockindex:'Stock Indices'};function render(list){if(!Array.isArray(list)||!list.length){box.innerHTML='<div class="card"><b>No markets returned</b><p class="muted">Refresh and check the Deriv connection.</p></div>';return}const by={};list.forEach(s=>{const g=s.market||s.underlying_symbol_type||'other';(by[g]??=[]).push(s)});box.innerHTML=Object.entries(by).map(([g,items])=>'<div class="card"><h3>'+ (names[g]||g.replace(/_/g,' ')) +'</h3><p class="muted">'+items.length+' available markets</p>'+items.slice(0,40).map(s=>'<a class="btn secondary" style="display:block;margin:7px 0" href="trade.html?symbol='+encodeURIComponent(s.underlying_symbol)+'">'+(s.underlying_symbol_name||s.underlying_symbol)+'</a>').join('')+'</div>').join('')}const ws=new WebSocket('wss://ws.deriv.com/websockets/v3');ws.onopen=()=>ws.send(JSON.stringify({active_symbols:'brief',req_id:9001}));ws.onmessage=e=>{const d=JSON.parse(e.data);if(d.msg_type==='active_symbols')render(d.active_symbols)};ws.onerror=()=>{box.innerHTML='<div class="card"><b>Market connection failed</b><p class="muted">Try refreshing the page.</p></div>'}})();</script></body></html>
