services:
  - type: web
    name: goonfx-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        value: https://goonfx.com
      - key: DERIV_REDIRECT_URI
        value: https://goonfx.com/callback.html
      - key: DERIV_CLIENT_ID
        sync: false
      - key: DERIV_CLIENT_SECRET
        sync: false
      - key: DERIV_APP_ID
        sync: false
